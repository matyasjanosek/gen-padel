<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen Padel Rožnov</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0d08;
      color: #e8eee0;
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1.5rem 2.5rem;
    }

    .logo {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #b5f23d;
      border: 1px solid #b5f23d;
      padding: 0.4rem 0.8rem;
    }

    nav ul { list-style: none; display: flex; gap: 2rem; }

    nav ul a {
      color: #6b7a5e;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav ul a:hover { color: #b5f23d; }

    .hero-text {
      position: fixed;
      top: 50%;
      left: 2.5rem;
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 7vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
    }

    h1 span { color: #b5f23d; }

    .sub {
      margin-top: 0.8rem;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6b7a5e;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .ar-wrap {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 10;
    }

    model-viewer { position: absolute; width: 0; height: 0; visibility: hidden; }

    .ar-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #b5f23d;
      color: #0a0d08;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.65rem 1.4rem;
      border: none;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    .ar-btn:hover { box-shadow: 0 6px 20px rgba(181,242,61,0.4); }
  </style>
</head>
<body>

  <nav>
    <div class="logo">GP</div>
    <ul>
      <li><a href="#">Roznov</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="hero-text">
    <h1>GEN<br><span>PADEL</span><br>ROZNOV</h1>
    <p class="sub">Roznov pod Radhostem · 2027</p>
  </div>

  <div class="ar-wrap">
    <model-viewer id="mv" src="padel_court.glb" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
    <button class="ar-btn" onclick="document.getElementById('mv').activateAR()">View in AR</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d08);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 2.5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.HemisphereLight(0x223311, 0x0a0d08, 1));
    const key = new THREE.DirectionalLight(0xb5f23d, 1.5);
    key.position.set(5, 10, 5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-5, 3, -3);
    scene.add(fill);
    const point = new THREE.PointLight(0xb5f23d, 2, 20);
    point.position.set(0, 3, 0);
    scene.add(point);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.enableZoom = false;

    // Particles
    const count = 200;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      // spread in a sphere around the court
      const r = 4 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi) * 0.5;
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const pgeo = new THREE.BufferGeometry();
    pgeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pmat = new THREE.PointsMaterial({ color: 0xb5f23d, size: 0.06, transparent: true, opacity: 0.6 });
    const particles = new THREE.Points(pgeo, pmat);
    scene.add(particles);

    // Load GLB
    const loader = new GLTFLoader();
    loader.load('padel_court.glb', (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 5 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));
      scene.add(model);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      // slowly rotate particles in opposite direction
      particles.rotation.y += 0.0008;
      particles.rotation.x += 0.0003;
      renderer.render(scene, camera);
    });
  </script>

</body>
</html>
